name: CI
# Manual only (Actions tab > CI > Run workflow): the author runs these checks locally before pushing.
on: [workflow_dispatch]

jobs:
  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -r requirements-pinned.txt && pip install -e ".[dev]"
      - run: ruff check hohypemb tests tools examples
      - run: pytest -m "not network and not slow"

  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check hohypemb tests tools examples
      - run: pytest -m "not network and not golden and not slow"
