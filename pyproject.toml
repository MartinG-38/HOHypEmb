[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hohypemb"
version = "0.1.0"
description = "Higher-order hyperbolic embedding (HHO) of simplicial complexes in the Poincaré disk"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
authors = [{name = "Martin Guillemaud"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.25"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hohypemb", "hohypemb.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not network'"
markers = [
    "golden: compares against the MLNHypEmb golden fixtures (pinned-versions CI job)",
    "network: downloads data from the internet (deselected by default)",
    "slow: long-running (minutes)",
]
filterwarnings = [
    "ignore:Jupyter is migrating its paths to use standard platformdirs:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]   # ruff's classic default set, stable across ruff versions
